<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tienda de cómics | SQL Lab</title>
<style>
:root{--bg:#170b2b;--panel:#281342;--panel2:#35185a;--line:#59348a;--blue:#c084fc;--blue2:#9333ea;--text:#f5edff;--muted:#c7b2df;--good:#86efac}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#4c1d95 0,#170b2b 50%,#0b0615 100%);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);line-height:1.5}header{padding:28px 5vw 20px;border-bottom:1px solid var(--line);background:#170b2be8;position:sticky;top:0;z-index:3;backdrop-filter:blur(10px)}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:1.25rem;font-weight:900;letter-spacing:.1em;color:#e9d5ff}.brand span{color:#c084fc}.tag{font-size:.8rem;color:var(--muted);letter-spacing:.18em}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1500px;margin:auto;gap:24px;padding:24px 4vw}.side{position:sticky;top:130px;height:calc(100vh - 145px);overflow:auto;background:#211035;border:1px solid var(--line);border-radius:16px;padding:16px}.side h3{color:var(--blue);font-size:.8rem;letter-spacing:.12em}.nav button{width:100%;text-align:left;background:transparent;color:var(--text);border:1px solid transparent;padding:10px;border-radius:9px;cursor:pointer}.nav button:hover,.nav button.active{background:#45236b;border-color:#8753c4}.main{min-width:0}.hero,.card{background:linear-gradient(140deg,#35184f,#241039);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}.hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.08;margin:.3em 0;color:#f3e8ff}.hero p{color:var(--muted);max-width:800px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}.kpi{padding:15px;border:1px solid #63418e;border-radius:12px;background:#1e0e34}.kpi strong{display:block;font-size:1.5rem;color:var(--blue)}h2,h3{color:#e9d5ff}h2{margin-top:0}.section-title{border-bottom:1px solid var(--line);padding-bottom:12px}.exercise{border:1px solid #4e2b77;background:#1d0d32;border-radius:12px;padding:16px;margin:12px 0}.exercise h4{margin:0 0 8px;color:#e9d5ff}.exercise p{margin:0;color:var(--muted)}.exercise .workarea{margin-top:14px}.exercise .editor{min-height:110px}.exercise details.hint{border:1px solid #71439b;border-radius:10px;padding:10px;background:#291440}.exercise details.hint summary{font-weight:700}.exercise .output{min-height:40px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid #71439b;border-radius:999px;padding:5px 10px;color:#e9d5ff;font-size:.78rem}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button,.btn{background:#45216b;color:#f5edff;border:1px solid #8852c2;border-radius:9px;padding:9px 13px;cursor:pointer}.tabs button.active,.btn.primary{background:#9333ea}.btn:hover,button:hover{filter:brightness(1.1)}.hidden{display:none!important}table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{text-align:left;padding:9px;border-bottom:1px solid #24456b}th{color:#d8b4fe}.schema{overflow:auto}.mission{border-left:4px solid #a855f7;padding:14px 18px;background:#1d0d32;margin:14px 0;border-radius:0 12px 12px 0}.badge{color:#e9d5ff;background:#49256e;border:1px solid #8050b7;padding:5px 10px;border-radius:999px;font-size:.85rem}.editor{width:100%;min-height:170px;background:#0e061a;color:#e8d5ff;border:1px solid #67409a;border-radius:12px;padding:13px;font-family:Consolas,monospace;font-size:14px}.output{background:#08040f;border:1px solid #4c2b70;border-radius:12px;overflow:auto;min-height:60px;padding:10px;margin-top:10px}.output table{min-width:500px}.err{color:#fca5a5}.ok{color:var(--good)}.foot{color:#b9a4d5;font-size:.85rem;padding:20px;text-align:center}details{margin:12px 0}summary{cursor:pointer;color:#e9d5ff}.progress{height:8px;background:#35214e;border-radius:999px;overflow:hidden}.progress div{height:100%;background:#c084fc;width:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#120821;padding:12px;border-radius:10px;color:#ead8ff}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:relative;top:0;height:auto}.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div class="top"><div><div class="brand">TIENDA DE CÓMICS <span>CÓMICS</span></div><div class="tag">SQL TRAINING LAB · DATABASE INVESTIGATION</div></div><div class="badge">SQLite · 65 ejercicios</div></div></header>
<div class="layout"><aside class="side"><h3>LAB NAVIGATION</h3><nav class="nav" id="nav"></nav><hr style="border-color:var(--line)"><div style="font-size:.85rem;color:var(--muted)">Progreso personal</div><div class="progress"><div id="progressbar"></div></div><div id="progresslabel" style="font-size:.8rem;color:var(--muted);margin-top:5px">0 / 65 ejercicios marcados</div><button class="btn" style="margin-top:14px;width:100%" onclick="downloadSQL()">Descargar base de datos SQL</button></aside>
<main class="main" id="main"></main></div><footer class="foot">TIENDA DE CÓMICS · SQL TRAINING LAB · Practica, investiga y documenta.</footer>
<script>
const sections=[
{level:'BÁSICO',name:'B01 · SELECT',desc:'Recupera información de una o varias columnas.',ex:['Muestra todos los registros de la tabla COMICS.','Muestra únicamente el título, precio y stock de todos los cómics.','Muestra el nombre y apellido de todos los clientes.','Muestra el título, año de publicación y precio de todos los cómics.','Muestra el nombre, apellido y puesto de todos los empleados.']},
{level:'BÁSICO',name:'B02 · WHERE',desc:'Filtra registros mediante condiciones.',ex:['Muestra los cómics cuyo precio sea superior a 20 €.','Muestra los cómics publicados en 2024.','Muestra los clientes que residen en Madrid.','Muestra los cómics cuyo stock sea inferior a 5 unidades.','Muestra los pedidos cuyo estado sea Pendiente.']},
{level:'BÁSICO',name:'B03 · AND, OR y LIKE',desc:'Combina condiciones y busca patrones de texto.',ex:['Muestra los cómics de Marvel cuyo precio sea superior a 15 €.','Muestra los cómics cuyo precio sea inferior a 10 € o cuyo stock sea superior a 20 unidades.','Busca los clientes cuyo nombre comience por la letra A.','Busca los cómics cuyo título contenga Batman.','Muestra los cómics publicados por DC Comics que tengan menos de 10 unidades en stock.']},
{level:'BÁSICO',name:'B04 · ORDER BY',desc:'Ordena resultados.',ex:['Ordena los cómics por precio de menor a mayor.','Ordena los cómics por precio de mayor a menor.','Ordena los clientes alfabéticamente por apellido.','Ordena los pedidos por fecha, del más antiguo al más reciente.','Ordena los cómics por stock de mayor a menor.']},
{level:'BÁSICO',name:'B05 · COUNT y SUM',desc:'Cuenta registros y suma valores.',ex:['Cuenta cuántos cómics hay registrados en el catálogo.','Cuenta cuántos clientes tiene la tienda.','Calcula la suma de unidades de stock de todos los cómics.','Calcula el valor económico total del stock de la tienda.','Cuenta cuántos pedidos hay registrados.']},
{level:'BÁSICO',name:'B06 · GROUP BY',desc:'Agrupa datos para obtener estadísticas.',ex:['Cuenta cuántos cómics hay por editorial.','Calcula el stock total de cómics por editorial.','Cuenta cuántos cómics hay por categoría.','Calcula el precio medio de los cómics por editorial.','Cuenta cuántos pedidos ha realizado cada cliente.']},
{level:'INTERMEDIO',name:'I01 · NULL y CASE',desc:'Gestiona valores ausentes y crea clasificaciones.',ex:['Encuentra los cómics que no tengan editorial asignada.','Encuentra los clientes cuyo teléfono no esté registrado.','Clasifica los cómics según su precio: Económico, Medio o Premium.','Clasifica el stock en Stock bajo, Stock medio y Stock alto.','Clasifica los pedidos según su estado utilizando CASE.']},
{level:'INTERMEDIO',name:'I02 · JOIN',desc:'Relaciona información de varias tablas.',ex:['Muestra los títulos de los cómics junto con el nombre de su editorial.','Muestra los títulos de los cómics junto con su categoría.','Muestra el nombre de cada cliente junto a los pedidos que ha realizado.','Muestra cada pedido, el cliente que lo realizó y el empleado que lo gestionó.','Muestra títulos, cantidad vendida y precio de venta de cada línea de pedido.']},
{level:'INTERMEDIO',name:'I03 · FECHAS',desc:'Filtra y analiza información temporal.',ex:['Busca todos los pedidos realizados durante 2025.','Busca los pedidos realizados durante enero de 2026.','Calcula cuántos pedidos se realizaron en cada mes.','Busca pedidos realizados en un intervalo de 30 días respecto a una fecha de referencia de los datos.','Identifica los pedidos realizados entre dos fechas concretas.']},
{level:'INTERMEDIO',name:'I04 · SUBCONSULTAS',desc:'Utiliza consultas anidadas.',ex:['Busca los cómics cuyo precio sea superior al precio medio del catálogo.','Busca los clientes que hayan realizado al menos un pedido.','Busca los cómics cuyo stock sea superior al stock medio.','Identifica la editorial con más cómics registrados.','Busca los clientes cuyo gasto total sea superior al gasto medio de los clientes.']},
{level:'AVANZADO',name:'A01 · CAMBIAR DATOS',desc:'Inserta, actualiza y elimina registros.',ex:['Añade un nuevo cómic al catálogo utilizando INSERT.','Añade un nuevo cliente utilizando INSERT.','Actualiza el precio de un cómic concreto utilizando UPDATE.','Incrementa el stock de un cómic después de una reposición.','Elimina un registro de prueba de la tabla CLIENTES mediante DELETE, verificando primero que la condición identifica el registro correcto.']},
{level:'AVANZADO',name:'A02 · WITH (CTE)',desc:'Divide consultas complejas en bloques reutilizables.',ex:['Crea una CTE que calcule el precio medio y muestra los cómics por encima de esa media.','Crea una CTE que calcule las ventas totales de cada cliente.','Crea una CTE que calcule las unidades vendidas por editorial.','Crea una CTE con stock total por categoría y filtra las categorías con más de 50 unidades.','Crea dos CTE: una para gasto por cliente y otra para filtrar quienes superen 200 €.']},
{level:'AVANZADO',name:'A03 · FUNCIONES DE VENTANA',desc:'Analiza filas relacionadas sin agruparlas en una sola.',ex:['Ordena los cómics por precio utilizando ROW_NUMBER().','Clasifica a los clientes según su gasto utilizando RANK().','Calcula las ventas acumuladas por fecha mediante SUM() OVER.','Calcula el total de ventas de cada cliente junto a cada pedido usando PARTITION BY.','Compara las ventas de cada pedido con las del pedido anterior mediante LAG().']}
];
const missions=[
{title:'OPERACIÓN 01 · Reconocimiento del catálogo',skill:'SELECT · WHERE · ORDER BY',tasks:['Identifica los 10 cómics más caros del catálogo.','Encuentra los cómics con menos de 3 unidades en stock.','Identifica los cómics publicados después de 2023.','Busca todos los cómics de una editorial concreta.','Localiza los cómics cuyo título contenga un término que elijas.'],badge:'Catalog Explorer'},
{title:'OPERACIÓN 02 · Auditoría de existencias',skill:'COUNT · SUM · GROUP BY',tasks:['Calcula el número total de cómics por editorial.','Calcula el stock total por categoría.','Identifica la categoría con mayor stock.','Calcula el valor del inventario por editorial.','Identifica qué editorial tiene el mayor valor económico en inventario.'],badge:'Stock Analyst'},
{title:'OPERACIÓN 03 · Perfil de clientes',skill:'WHERE · LIKE · AND · OR · CASE · NULL',tasks:['Identifica clientes sin teléfono registrado.','Clasifica clientes por ciudad.','Identifica clientes que no han completado todos sus datos.','Clasifica clientes según su actividad comercial.','Busca clientes que cumplan dos condiciones simultáneamente y explica por qué los seleccionaste.'],badge:'Customer Intelligence'},
{title:'OPERACIÓN 04 · Reconstrucción de ventas',skill:'JOIN',tasks:['Reconstruye el listado de pedidos con sus clientes.','Identifica qué cómics se han vendido en cada pedido.','Calcula el importe de cada línea de pedido.','Calcula el importe total de cada pedido.','Identifica empleados que han gestionado pedidos y cuántos han gestionado.'],badge:'Sales Investigator'},
{title:'OPERACIÓN 05 · Análisis temporal',skill:'Fechas · GROUP BY · ORDER BY',tasks:['Calcula las ventas por mes.','Identifica el mes con mayor facturación.','Calcula el número de pedidos por mes.','Compara las ventas de dos periodos.','Identifica los días con mayor actividad comercial.'],badge:'Time Analyst'},
{title:'OPERACIÓN 06 · Identificación de oportunidades',skill:'Subconsultas',tasks:['Identifica los cómics con precio superior al promedio.','Encuentra los clientes cuyo gasto supera el gasto medio.','Identifica las editoriales con un catálogo superior al promedio de editoriales.','Busca los cómics con más unidades vendidas que la media.','Identifica los clientes que nunca han realizado un pedido.'],badge:'Data Detective'},
{title:'OPERACIÓN 07 · Gestión de incidencias',skill:'INSERT · UPDATE · DELETE',tasks:['Añade un nuevo cómic a la base de datos.','Registra un nuevo cliente.','Actualiza el precio de un cómic.','Registra una reposición de stock.','Elimina un registro de prueba que no tenga datos asociados que deban conservarse.'],badge:'Database Operator'},
{title:'OPERACIÓN 08 · Informe ejecutivo',skill:'WITH',tasks:['Calcula la facturación total por cliente.','Calcula las unidades vendidas por editorial.','Identifica los 5 cómics más vendidos.','Calcula el valor del inventario por categoría.','Identifica clientes que superen una cantidad de gasto determinada.'],badge:'SQL Architect'},
{title:'OPERACIÓN 09 · Inteligencia comercial',skill:'Funciones de ventana',tasks:['Clasifica a los clientes por gasto.','Clasifica los cómics por unidades vendidas.','Calcula la facturación acumulada por fecha.','Compara cada mes con el mes anterior.','Calcula el ranking de ventas de cada editorial.'],badge:'Advanced Analyst'},
{title:'OPERACIÓN 10 · Informe para dirección',skill:'SQL libre · Integración',tasks:['¿Qué editorial genera más ingresos?','¿Qué cómics son los más vendidos?','¿Qué productos necesitan reposición?','¿Qué clientes generan mayor facturación?','¿Qué categorías funcionan mejor?','¿Qué meses concentran más ventas?','¿Qué productos tienen poco movimiento?','Propón decisiones comerciales basadas en los datos.'],badge:'Tienda de cómics Master'}];
const schema={EDITORIALES:[['editorial_id','INTEGER','PK'],['nombre','TEXT',''],['pais','TEXT','']],CATEGORIAS:[['categoria_id','INTEGER','PK'],['nombre','TEXT','']],CLIENTES:[['cliente_id','INTEGER','PK'],['nombre','TEXT',''],['apellido','TEXT',''],['ciudad','TEXT',''],['email','TEXT',''],['telefono','TEXT',''],['fecha_registro','DATE','']],EMPLEADOS:[['empleado_id','INTEGER','PK'],['nombre','TEXT',''],['apellido','TEXT',''],['puesto','TEXT',''],['fecha_contratacion','DATE','']],COMICS:[['comic_id','INTEGER','PK'],['titulo','TEXT',''],['editorial_id','INTEGER','FK'],['categoria_id','INTEGER','FK'],['precio','REAL',''],['stock','INTEGER',''],['ano_publicacion','INTEGER','']],PEDIDOS:[['pedido_id','INTEGER','PK'],['cliente_id','INTEGER','FK'],['empleado_id','INTEGER','FK'],['fecha_pedido','DATE',''],['estado','TEXT','']],DETALLE_PEDIDOS:[['detalle_id','INTEGER','PK'],['pedido_id','INTEGER','FK'],['comic_id','INTEGER','FK'],['cantidad','INTEGER',''],['precio_unitario','REAL','']],INVENTARIO:[['movimiento_id','INTEGER','PK'],['comic_id','INTEGER','FK'],['empleado_id','INTEGER','FK'],['fecha_movimiento','DATE',''],['tipo_movimiento','TEXT',''],['cantidad','INTEGER',''],['observaciones','TEXT','']]};
function makeNav(){let nav=document.getElementById('nav');nav.innerHTML=`<button class="active" onclick="show('home',this)">▣ Inicio</button><button onclick="show('schema',this)">▤ Esquema de tablas</button><button onclick="show('exercises',this)">▣ Ejercicios</button><button onclick="show('mission',this)">★ Misión final</button><button onclick="show('sql',this)">⌘ Consola SQL</button>`}
function show(page,btn){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');const main=document.getElementById('main');if(page==='home'){main.innerHTML=home()}if(page==='schema'){main.innerHTML=schemaPage()}if(page==='exercises'){main.innerHTML=exercisePage();setTimeout(buildEx,0)}if(page==='mission'){main.innerHTML=missionPage()}if(page==='sql'){main.innerHTML=sqlPage();initSQL()} }
function home(){return `<section class="hero"><div class="tag">DATABASE INVESTIGATION / TRAINING</div><h1>TIENDA DE CÓMICS<br><span style="color:#c084fc">CÓMICS</span></h1><p>Una tienda ficticia de cómics. Una base de datos. 65 ejercicios SQL y una misión final para investigar el negocio, detectar patrones y tomar decisiones.</p><div class="kpis"><div class="kpi"><strong>65</strong>Ejercicios</div><div class="kpi"><strong>13</strong>Apartados</div><div class="kpi"><strong>3</strong>Niveles</div><div class="kpi"><strong>10</strong>Operaciones</div></div></section><section class="card"><h2>Briefing</h2><p>Tienda de cómics necesita analizar su catálogo, clientes, pedidos, ventas e inventario. Tu trabajo será investigar los datos utilizando SQL, progresando desde consultas básicas hasta análisis avanzados.</p><h3>Cómo trabajar</h3><ol><li>Explora las tablas y sus relaciones.</li><li>Resuelve los ejercicios por orden o utiliza la navegación para seleccionar un apartado.</li><li>Marca cada ejercicio como completado para llevar tu progreso.</li><li>En la misión final, utiliza varias técnicas SQL para elaborar recomendaciones.</li></ol><div class="tabs"><button onclick="show('schema')">Ver esquema</button><button onclick="show('exercises')">Empezar ejercicios</button><button onclick="show('mission')">Abrir misión final</button><button onclick="show('sql')">Abrir consola SQL</button></div></section><section class="card"><h2>Contenido</h2><p><span class="pill">Básico</span> SELECT · WHERE · AND/OR/LIKE · ORDER BY · COUNT/SUM · GROUP BY</p><p><span class="pill">Intermedio</span> NULL/CASE · JOIN · Fechas · Subconsultas</p><p><span class="pill">Avanzado</span> Cambiar datos · WITH · Ventanas</p><p><span class="pill">Misión final</span> 10 operaciones de investigación</p></section>`}
function schemaPage(){let out='<section class="card"><h2 class="section-title">Esquema de la base de datos</h2><p>Consulta los campos y claves de cada tabla. PK identifica la clave primaria; FK indica una clave foránea.</p>';for(let t in schema){out+=`<details open><summary><b>${t}</b></summary><div class="schema"><table><tr><th>Campo</th><th>Tipo</th><th>Clave</th></tr>${schema[t].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table></div></details>`}out+='<h3>Relaciones</h3><pre>EDITORIALES 1 ─── N COMICS\nCATEGORIAS 1 ─── N COMICS\nCLIENTES 1 ─── N PEDIDOS\nEMPLEADOS 1 ─── N PEDIDOS\nPEDIDOS 1 ─── N DETALLE_PEDIDOS\nCOMICS 1 ─── N DETALLE_PEDIDOS\nCOMICS 1 ─── N INVENTARIO\nEMPLEADOS 1 ─── N INVENTARIO</pre></section>';return out}
function exercisePage(){return `<section class="card"><h2 class="section-title">Cuaderno de ejercicios</h2><div class="tabs" id="exTabs"></div><div id="exBody"></div></section>`}
function buildEx(){let tabs=document.getElementById('exTabs'),body=document.getElementById('exBody');if(!tabs||!body)return;tabs.innerHTML=sections.map((s,i)=>`<button class="${i===0?'active':''}" onclick="exTab(${i},this)">${s.name}</button>`).join('');exTab(0,tabs.firstChild)}function exTab(i,b){document.querySelectorAll('#exTabs button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');let s=sections[i];document.getElementById('exBody').innerHTML=`<h3>${s.name}</h3><p>${s.desc}</p><span class="pill">${s.level}</span>${s.ex.map((e,j)=>exerciseCard(`EX-${i+1}.${j+1}`,e,i*5+j)).join('')}`}
function hintFor(i){const topic=i<5?'SELECT':i<10?'WHERE':i<15?'AND, OR y LIKE':i<20?'ORDER BY':i<25?'COUNT y SUM':i<30?'GROUP BY':i<35?'NULL y CASE':i<40?'JOIN':i<45?'Fechas':i<50?'Subconsultas':i<55?'INSERT, UPDATE y DELETE':i<60?'CTE (WITH)':'Funciones de ventana';const hints={'SELECT':'Piensa qué columnas necesitas mostrar. Si quieres todas, existe una forma abreviada.','WHERE':'Necesitarás una condición que filtre las filas.','AND, OR y LIKE':'Combina condiciones o usa un patrón con comodines para buscar texto.','ORDER BY':'Añade la cláusula de ordenación al final de la consulta.','COUNT y SUM':'Revisa qué función de agregación cuenta filas y cuál suma valores.','GROUP BY':'Agrupa por la columna que define cada categoría antes de aplicar la agregación.','NULL y CASE':'IS NULL permite comprobar valores ausentes. CASE WHEN permite crear etiquetas según condiciones.','JOIN':'Identifica las claves que relacionan las tablas y el tipo de JOIN que necesitas.','Fechas':'Puedes filtrar fechas con rangos o extraer partes de una fecha.','Subconsultas':'Primero piensa qué resultado necesitas obtener en la consulta interior.','INSERT, UPDATE y DELETE':'Comprueba la tabla y las columnas. En UPDATE y DELETE verifica el WHERE antes de ejecutar.','CTE (WITH)':'Define primero un resultado temporal con WITH nombre AS (SELECT...).','Funciones de ventana':'OVER permite calcular sobre un conjunto de filas sin agruparlas en una única fila.'};return hints[topic]||'Divide el problema en pasos pequeños y consulta el esquema de tablas.'}function exerciseCard(id,text,index){const safeId=id.replace(/[^a-zA-Z0-9]/g,'_');return `<div class="exercise" id="${safeId}"><h4>${id}</h4><p>${text}</p><div class="workarea"><textarea class="editor" id="q_${safeId}" placeholder="Escribe aquí tu consulta SQL..."></textarea><div class="tools"><button class="btn primary" onclick="runExercise('${safeId}')">▶ Ejecutar consulta</button><button class="btn" onclick="clearExercise('${safeId}')">Limpiar</button></div><div class="output" id="out_${safeId}">Aquí aparecerá el resultado de tu consulta.</div><details class="hint"><summary>💡 Ver pista</summary><p style="margin-top:8px">${hintFor(index)}</p></details></div><label style="display:block;margin-top:10px"><input type="checkbox" onchange="mark(${index},this.checked)" ${isMarked(index)?'checked':''}> Marcar como completado</label></div>`}function runExercise(id){runQueryIn(document.getElementById('q_'+id).value,'out_'+id)}function clearExercise(id){document.getElementById('q_'+id).value='';document.getElementById('out_'+id).innerHTML='Aquí aparecerá el resultado de tu consulta.'}function runQueryIn(q,target){const box=document.getElementById(target);try{if(!SQLdb){box.innerHTML='<span class="err">La base de datos aún se está cargando. Abre Consola SQL para inicializarla.</span>';return}let res=SQLdb.exec(q);let html='';if(!res.length)html='<span class="ok">Consulta ejecutada. No se han devuelto filas.</span>';for(const r of res){html+='<table><thead><tr>'+r.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+r.values.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v===null?'NULL':v)+'</td>').join('')+'</tr>').join('')+'</tbody></table><p>'+r.values.length+' fila(s)</p>'}box.innerHTML=html}catch(e){box.innerHTML='<span class="err">SQL error: '+esc(e.message)+'</span>'}}
function missionPage(){return `<section class="hero"><div class="tag">FINAL QUEST · CASE FILE 001</div><h1>OPERACIÓN:<br><span style="color:#c084fc">TIENDA DE CÓMICS</span></h1><p>La tienda presenta problemas de inventario, ventas irregulares y pérdida de clientes. La dirección necesita un informe antes de tomar decisiones.</p><div class="badge">Tu papel: Analista de datos</div></section><section class="card"><h2>Reglas de la misión</h2><p>Completa las operaciones. Cada una desbloquea una insignia simbólica. No basta con obtener un resultado: intenta explicar qué información revela tu consulta.</p>${missions.map((m,i)=>`<details class="mission"><summary><b>${m.title}</b> <span class="pill">${m.skill}</span></summary><p>${m.tasks.map((t,j)=>`${j+1}. ${t}`).join('<br>')}</p><label><input type="checkbox" onchange="markMission(${i},this.checked)" ${isMission(i)?'checked':''}> Operación completada</label><p><span class="badge">Insignia: ${m.badge}</span></p></details>`).join('')}</section><section class="card"><h2>Informe de cierre</h2><p>Redacta tus conclusiones a partir de las consultas:</p><ol><li>Principales hallazgos.</li><li>Problemas detectados.</li><li>Productos o categorías que requieren atención.</li><li>Clientes relevantes para el negocio.</li><li>Tres recomendaciones justificadas por datos.</li></ol></section>`}
function sqlPage(){return `<section class="card"><h2>Consola SQL de práctica</h2><p>Esta consola usa SQL.js (SQLite en el navegador). Carga el dataset de ejemplo y ejecuta consultas sin instalar nada. La conexión requiere internet para cargar la biblioteca SQL.js la primera vez.</p><textarea id="query" class="editor">SELECT * FROM COMICS LIMIT 10;</textarea><div class="tools"><button class="btn primary" onclick="runSQL()">▶ Ejecutar consulta</button><button class="btn" onclick="resetSQL()">Restaurar base de datos</button><button class="btn" onclick="downloadSQL()">Descargar SQL</button></div><div id="result" class="output">Carga el motor SQL.js para comenzar.</div></section>`}
let marked=JSON.parse(localStorage.getItem('bp-marked')||'[]'),missionMarked=JSON.parse(localStorage.getItem('bp-missions')||'[]');function isMarked(i){return marked.includes(i)}function mark(i,v){marked=marked.filter(x=>x!==i);if(v)marked.push(i);localStorage.setItem('bp-marked',JSON.stringify(marked));updateProgress()}function isMission(i){return missionMarked.includes(i)}function markMission(i,v){missionMarked=missionMarked.filter(x=>x!==i);if(v)missionMarked.push(i);localStorage.setItem('bp-missions',JSON.stringify(missionMarked))}function updateProgress(){let n=marked.length;document.getElementById('progressbar').style.width=(n/65*100)+'%';document.getElementById('progresslabel').textContent=`${n} / 65 ejercicios marcados`}
